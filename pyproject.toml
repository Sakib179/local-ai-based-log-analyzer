[project]
name = "local-ai-security-log-analyzer"
version = "0.1.0"
description = "Offline-first FastAPI foundation for local security log analysis."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: opt-in checks against the existing local llama.cpp tokenizer"]
